post:
  tags: [Auth]
  summary: Register a new user
  operationId: registerUser
  description: >
    Create a new user account.  
    Requires a name, email, and password.  
    The email must be unique and in a valid format.
  security: [] # публічна операція
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [name, email, password]
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 20
              example: John Doe
            email:
              type: string
              format: email
              example: johndoe@example.com
            password:
              type: string
              minLength: 6
              maxLength: 100
              example: StrongPass123
  responses:
    '201':
      description: User successfully registered
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Registration successful. Please verify your email.
    '400':
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: ../../components/schemas/Error.yaml }
    '409':
      description: Email already in use
      content:
        application/json:
          schema: { $ref: ../../components/schemas/Error.yaml }
