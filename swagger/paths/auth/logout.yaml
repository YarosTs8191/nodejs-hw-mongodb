post:
  tags: [Auth]
  summary: Logout user
  operationId: logoutUser
  description: >
    Log out the currently authenticated user by invalidating the refresh token.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Successful logout
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Logout successful
    '401':
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: ../../components/schemas/Error.yaml }
