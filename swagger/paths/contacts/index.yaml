get:
  tags: [Contacts]
  summary: Get all contacts
  operationId: getAllContacts
  description: >
    Retrieve a paginated list of contacts for the authenticated user.
    Supports pagination, sorting by name, and filtering by type / isFavourite.
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: page
      required: false
      description: Page number (starts from 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    - in: query
      name: perPage
      required: false
      description: Items per page
      schema:
        type: integer
        minimum: 1
        default: 10
    - in: query
      name: sortBy
      required: false
      description: 'Property to sort by (default: name)'
      schema:
        type: string
        default: 'name'
    - in: query
      name: sortOrder
      required: false
      description: Sort order (asc | desc)
      schema:
        type: string
        enum:
          - asc
          - desc
        default: 'asc'
    - in: query
      name: type
      required: false
      description: Filter by contactType
      schema:
        type: string
        enum:
          - work
          - home
          - personal
    - in: query
      name: isFavourite
      required: false
      description: Filter by favourite flag
      schema:
        type: boolean
  responses:
    '200':
      description: Wrapped list of contacts with pagination
      content:
        application/json:
          schema:
            type: object
            required: [status, message, data]
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contacts!
              data:
                type: object
                required:
                  [
                    data,
                    page,
                    perPage,
                    totalItems,
                    totalPages,
                    hasPreviousPage,
                    hasNextPage,
                  ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/Contact.yaml
                  page:
                    type: integer
                    example: 1
                  perPage:
                    type: integer
                    example: 10
                  totalItems:
                    type: integer
                    example: 47
                  totalPages:
                    type: integer
                    example: 5
                  hasPreviousPage:
                    type: boolean
                    example: false
                  hasNextPage:
                    type: boolean
                    example: true
    '400':
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Error.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Error.yaml

post:
  tags: [Contacts]
  summary: Create a new contact
  operationId: createContact
  description: >
    Add a new contact to the authenticated user's contact book.
    This endpoint supports file upload for a contact's photo.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [name, phoneNumber, contactType]
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 20
              example: John Doe
            phoneNumber:
              type: string
              minLength: 3
              maxLength: 20
              example: '+380671234567'
            email:
              type: string
              format: email
              minLength: 3
              maxLength: 20
              example: johndoe@example.com
            isFavourite:
              type: boolean
              example: false
            contactType:
              type: string
              enum: [work, home, personal]
              example: personal
