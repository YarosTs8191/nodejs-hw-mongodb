parameters:
  - in: path
    name: contactId
    required: true
    description: The unique ID of the contact
    schema: { type: string }

get:
  tags: [Contacts]
  summary: Get contact by ID
  operationId: getContactById
  description: Retrieve a single contact by its unique ID.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Contact found
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Contact.yaml }
    '400':
      description: Invalid ID format
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '401':
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '404':
      description: Contact not found
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }

patch:
  tags: [Contacts]
  summary: Update contact by ID
  operationId: updateContact
  description: >
    Update fields of an existing contact by its unique ID.
    Supports partial updates and file upload for the contact's photo.
  security:
    - bearerAuth: []
  requestBody:
    required: false
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 20
              example: John Doe
            phoneNumber:
              type: string
              minLength: 3
              maxLength: 20
              example: '+380671234567'
            email:
              type: string
              format: email
              minLength: 3
              maxLength: 20
              example: johndoe@example.com
            isFavourite:
              type: boolean
              example: false
            contactType:
              type: string
              enum: [work, home, personal]
              example: personal
            photo:
              type: string
              format: binary
  responses:
    '200':
      description: Contact successfully updated
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Contact.yaml }
    '400':
      description: Invalid request body or ID
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '401':
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '404':
      description: Contact not found
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }

delete:
  tags: [Contacts]
  summary: Delete contact by ID
  operationId: deleteContact
  description: Permanently delete a contact by its unique ID.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Contact successfully deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Contact deleted successfully
    '400':
      description: Invalid ID format
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '401':
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '404':
      description: Contact not found
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
