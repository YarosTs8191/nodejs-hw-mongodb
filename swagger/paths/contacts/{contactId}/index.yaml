parameters:
  - in: path
    name: contactId
    required: true
    description: The unique ID of the contact
    schema: { type: string }

get:
  tags: [Contacts]
  summary: Get contact by ID
  operationId: getContactById
  description: Retrieve a single contact by its unique ID.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Contact found (wrapped)
      content:
        application/json:
          schema:
            type: object
            required: [status, message, data]
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contact!
              data:
                $ref: ../../../components/schemas/Contact.yaml
    '400':
      description: Invalid ID format
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '401':
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '404':
      description: Contact not found
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }

patch:
  tags: [Contacts]
  summary: Update contact by ID
  operationId: updateContact
  description: >
    Update fields of an existing contact by its unique ID.
    Supports partial updates and file upload for the contact's photo.
  security:
    - bearerAuth: []
  requestBody:
    required: false
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 20
            phoneNumber:
              type: string
              minLength: 3
              maxLength: 20
            email:
              type: string
              format: email
              minLength: 3
              maxLength: 20
            isFavourite:
              type: boolean
            contactType:
              type: string
              enum: [work, home, personal]
            photo:
              type: string
              format: binary
  responses:
    '200':
      description: Contact updated (wrapped)
      content:
        application/json:
          schema:
            type: object
            required: [status, message, data]
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully patched a contact!
              data:
                $ref: ../../../components/schemas/Contact.yaml
    '400':
      description: Invalid request body or ID
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '401':
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '404':
      description: Contact not found
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }

delete:
  tags: [Contacts]
  summary: Delete contact by ID
  operationId: deleteContact
  description: Permanently delete a contact by its unique ID.
  security:
    - bearerAuth: []
  responses:
    '204':
      description: No Content (contact deleted)
    '400':
      description: Invalid ID format
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '401':
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
    '404':
      description: Contact not found
      content:
        application/json:
          schema: { $ref: ../../../components/schemas/Error.yaml }
