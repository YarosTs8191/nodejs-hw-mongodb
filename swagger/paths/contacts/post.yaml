post:
  tags:
    - Contacts
  summary: Додати новий контакт
  operationId: createContact
  description: Додає новий контакт у вашу контактну книгу.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phoneNumber:
              type: string
            contactType:
              type: string
            photo:
              type: string
              format: binary
  responses:
    '201':
      description: Контакт створено
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Contact.yaml
    '400':
      $ref: ../../components/schemas/Error.yaml
    '401':
      $ref: ../../components/schemas/Error.yaml
