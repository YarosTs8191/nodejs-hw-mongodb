tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: >
  Retrieve a paginated list of contacts for the authenticated user.
  Use query parameters `page` and `limit` to control pagination.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    required: false
    description: Page number (starts from 1)
    schema:
      type: integer
      minimum: 1
      default: 1
  - in: query
    name: limit
    required: false
    description: Number of items per page
    schema:
      type: integer
      minimum: 1
      default: 10
responses:
  '200':
    description: A list of contacts (paginated)
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../components/schemas/Contact.yaml
  '400':
    description: Invalid request parameters
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
